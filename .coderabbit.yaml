# CodeRabbit 설정
# 참고: https://docs.coderabbit.ai/reference/configuration
#
# 목적: 이 레포에 mobile-scroll / adaptive-landing 두 개의 독립된 프로젝트가
# 들어있고, push마다 자동 전체 리뷰 + 부가기능이 전부 켜진 기본값 상태라
# 리뷰 리미트가 빨리 소진되고 있음. 아래 설정으로 소모량을 줄인다.

language: "ko-KR"

reviews:
  # ── 리미트 소모량을 가장 크게 줄이는 설정 ──────────────────
  # PR을 열면(또는 draft 해제하면) 여전히 자동으로 1회 리뷰함 — 리뷰 요청을
  # 깜빡할 걱정 없음. 대신 그 이후 push마다 매번 전체 재리뷰하던 것만 끔
  # (auto_incremental_review: false) — 실제로 리미트를 가장 크게 갉아먹는
  # 부분이 "PR 하나에 커밋을 여러 번 나눠 올릴 때마다의 재리뷰"였음.
  # 재리뷰가 필요하면 PR 코멘트에 "@coderabbitai review"로 수동 요청.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
    ignore_title_keywords:
      - "WIP"
      - "wip"
      - "draft"

  # ── 리뷰 대상에서 제외 (노이즈 감소) ────────────────────────
  path_filters:
    - "!.bkit/**"
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/package-lock.json"
    - "!**/*.webp"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.ico"

  # ── 부가 기능 끄기 (장식성 코멘트, 리미트만 소모) ──────────
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false

  # ── 프로젝트별 리뷰 지침 분리 ───────────────────────────────
  # mobile-scroll/CLAUDE.md는 knowledge_base.code_guidelines가 기본으로
  # 읽어들이므로 내용을 여기 중복 작성하지 않음.
  path_instructions:
    - path: "mobile-scroll/**"
      instructions: |
        분양 랜딩페이지 멀티 현장 템플릿(mobile-scroll/CLAUDE.md 참고).
        공유 컴포넌트(components/)나 app/api/sms/route.js를 수정할 때는
        새로 참조하는 필드가 data/sites/*.js 전체 현장에 없어도(optional)
        안전하게 동작하는지(?., ?? 처리) 반드시 확인해줘.
        adaptive-landing/ 쪽 변경과는 무관한 별도 프로젝트이니 섞어서
        리뷰하지 말 것.
    - path: "adaptive-landing/**"
      instructions: |
        mobile-scroll과 무관한 독립된 반응형 랜딩페이지 프로젝트.
        mobile-scroll 쪽 컨벤션(테마 주입, site.js 분리 등)을 기준으로
        지적하지 말 것 — 이 프로젝트는 구조가 다름.
